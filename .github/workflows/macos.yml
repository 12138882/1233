name: macOS SSH and RDP via Tailscale
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Session duration in minutes (10-300)
        required: true
        default: '60'
        type: string
permissions:
  contents: read
concurrency:
  group: remote-macos
  cancel-in-progress: false
env:
  BROWSER_BACKUP_REPOSITORY: 12138882/1233-browser-data
  BROWSER_LOCAL_SEED_MANIFEST_ID: ${{ vars.BROWSER_LOCAL_SEED_MANIFEST_ID }}
jobs:
  desktop:
    runs-on: macos-15-intel
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate configuration
        env:
          SESSION_MINUTES: ${{ inputs.minutes }}
          TS_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          SSH_HOST_KEY: ${{ secrets.MACOS_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          [[ "$SESSION_MINUTES" =~ ^[0-9]+$ ]] && ((10#$SESSION_MINUTES >= 10 && 10#$SESSION_MINUTES <= 300)) || exit 1
          test -n "$TS_KEY" && test -n "$SSH_PUBLIC_KEY" && test -n "$SSH_HOST_KEY"
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: remote-macos-1233
          args: --advertise-exit-node --accept-dns=false
      - name: Configure SSH and forwarding
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          SSH_HOST_KEY: ${{ secrets.MACOS_SSH_HOST_KEY }}
        run: bash scripts/setup-macos.sh
      - name: Restore runner DNS
        run: |
          set -euo pipefail
          if networksetup -listallnetworkservices | grep -Fxq Ethernet; then
            sudo networksetup -setdnsservers Ethernet Empty
          fi
          sudo dscacheutil -flushcache
          python3 - <<'PY'
          import socket
          for host in ('github.com', 'api.github.com'):
              socket.getaddrinfo(host, 443)
              print(f'DNS ready: {host}')
          PY
      - name: Install private RDP server
        timeout-minutes: 15
        continue-on-error: true
        run: |
          set -euo pipefail
          brew install DawidAdamski/mac-rdp-server/mac-rdp-server
          mac-rdp-server --check-permissions > "$RUNNER_TEMP/rdp-permissions.txt" 2>&1 || true
          nohup mac-rdp-server --bind-addr 127.0.0.1 > "$RUNNER_TEMP/rdp.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/rdp.pid"
          sleep 3
          python3 - <<'PY'
          import json, os, pathlib, socket
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'connection.json'
          data = json.loads(p.read_text())
          try:
              with socket.create_connection(('127.0.0.1', 3389), timeout=3):
                  data['rdp_listening'] = True
          except OSError:
              data['rdp_listening'] = False
          data['rdp_transport'] = 'ssh-tunnel'
          data['rdp_permissions'] = (p.parent / 'rdp-permissions.txt').read_text(errors='replace')
          p.write_text(json.dumps(data, indent=2))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore private Chrome data
        id: browser_restore
        env:
          GH_TOKEN: ${{ secrets.GH_REMOTE_TOKEN }}
          BROWSER_BACKUP_KEY: ${{ secrets.BROWSER_BACKUP_KEY }}
        run: node scripts/browser-data.cjs restore
      - name: Configure Chrome shortcuts
        run: bash scripts/setup-chrome-macos.sh
      - name: Start Chrome in background
        id: chrome_start
        run: node scripts/browser-data.cjs launch
      - name: Save initial encrypted browser checkpoint
        env:
          GH_TOKEN: ${{ secrets.GH_REMOTE_TOKEN }}
          BROWSER_BACKUP_KEY: ${{ secrets.BROWSER_BACKUP_KEY }}
        run: node scripts/browser-data.cjs backup
      - name: Publish connection information
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-connection
          path: ${{ runner.temp }}/connection.json
          retention-days: 1
          if-no-files-found: error
      - name: Keep session available
        env:
          SESSION_MINUTES: ${{ inputs.minutes }}
          GH_TOKEN: ${{ secrets.GH_REMOTE_TOKEN }}
          BROWSER_BACKUP_KEY: ${{ secrets.BROWSER_BACKUP_KEY }}
        run: node scripts/browser-data.cjs session
      - name: Save final encrypted browser data
        if: ${{ always() && steps.browser_restore.outcome == 'success' && steps.chrome_start.outcome == 'success' }}
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ secrets.GH_REMOTE_TOKEN }}
          BROWSER_BACKUP_KEY: ${{ secrets.BROWSER_BACKUP_KEY }}
        run: node scripts/browser-data.cjs finish
