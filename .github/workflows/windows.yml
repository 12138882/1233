name: Windows RDP via Tailscale
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Session duration in minutes (10-300)
        required: true
        default: '60'
        type: string
permissions:
  contents: read
concurrency:
  group: remote-windows
  cancel-in-progress: false
env:
  BROWSER_BACKUP_REPOSITORY: 12138882/1233-browser-data
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 330
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate configuration
        env:
          SESSION_MINUTES: ${{ inputs.minutes }}
          TS_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          DESKTOP_PASSWORD: ${{ secrets.WINDOWS_DESKTOP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $minutes = 0
          if (-not [int]::TryParse($env:SESSION_MINUTES, [ref]$minutes) -or $minutes -lt 10 -or $minutes -gt 300) { throw 'Session must be 10-300 minutes' }
          if (-not $env:TS_KEY -or -not $env:DESKTOP_PASSWORD) { throw 'Required secrets are missing' }
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: remote-windows-1233
          args: --advertise-exit-node --accept-dns=false
      - name: Configure private RDP
        env:
          DESKTOP_PASSWORD: ${{ secrets.WINDOWS_DESKTOP_PASSWORD }}
        run: ./scripts/setup-windows.ps1
      - name: Install AList and desktop shortcuts
        env:
          ALIST_ADMIN_PASSWORD: ${{ secrets.ALIST_ADMIN_PASSWORD }}
        run: ./scripts/setup-alist-windows.ps1
      - name: Configure quiet desktop startup
        run: ./scripts/quiet-windows.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore private Chrome data
        id: browser_restore
        env:
          GH_TOKEN: ${{ secrets.GH_REMOTE_TOKEN }}
          BROWSER_BACKUP_KEY: ${{ secrets.BROWSER_BACKUP_KEY }}
        run: node scripts/browser-data.cjs restore
      - name: Configure Chrome shortcuts
        run: ./scripts/setup-chrome-windows.ps1
      - name: Start Chrome in background
        id: chrome_start
        run: node scripts/browser-data.cjs launch
      - name: Save initial encrypted browser checkpoint
        env:
          GH_TOKEN: ${{ secrets.GH_REMOTE_TOKEN }}
          BROWSER_BACKUP_KEY: ${{ secrets.BROWSER_BACKUP_KEY }}
        run: node scripts/browser-data.cjs backup
      - name: Publish connection information
        uses: actions/upload-artifact@v4
        with:
          name: windows-connection
          path: ${{ runner.temp }}/connection.json
          retention-days: 1
          if-no-files-found: error
      - name: Keep session available
        env:
          SESSION_MINUTES: ${{ inputs.minutes }}
          GH_TOKEN: ${{ secrets.GH_REMOTE_TOKEN }}
          BROWSER_BACKUP_KEY: ${{ secrets.BROWSER_BACKUP_KEY }}
        run: node scripts/browser-data.cjs session
      - name: Save final encrypted browser data
        if: ${{ always() && steps.browser_restore.outcome == 'success' && steps.chrome_start.outcome == 'success' }}
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ secrets.GH_REMOTE_TOKEN }}
          BROWSER_BACKUP_KEY: ${{ secrets.BROWSER_BACKUP_KEY }}
        run: node scripts/browser-data.cjs finish
